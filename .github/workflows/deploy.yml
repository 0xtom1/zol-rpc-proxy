name: Deploy

on:
  push:
    branches: [dev, main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    env:
      REGION: us-central1
      REPO_NAME: wallet-api
      IMAGE_NAME: wallet-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Map prod secrets (no suffix) into neutral env var names.
      # ::add-mask:: re-applies masking so values stay redacted in all subsequent steps.
      - name: Load prod secrets
        if: github.ref_name == 'main'
        run: |
          echo "::add-mask::${{ secrets.GCP_PROJECT_ID }}"
          echo "::add-mask::${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          echo "::add-mask::${{ secrets.GCP_SERVICE_ACCOUNT }}"
          echo "::add-mask::${{ secrets.HELIUS_API_KEY }}"
          echo "::add-mask::${{ secrets.CORS_ALLOW_ORIGIN }}"
          echo "::add-mask::${{ secrets.TF_STATE_BUCKET }}"
          echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"
          echo "GCP_WORKLOAD_IDENTITY_PROVIDER=${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" >> "$GITHUB_ENV"
          echo "GCP_SERVICE_ACCOUNT=${{ secrets.GCP_SERVICE_ACCOUNT }}" >> "$GITHUB_ENV"
          echo "HELIUS_API_KEY=${{ secrets.HELIUS_API_KEY }}" >> "$GITHUB_ENV"
          echo "CORS_ALLOW_ORIGIN=${{ secrets.CORS_ALLOW_ORIGIN }}" >> "$GITHUB_ENV"
          echo "TF_STATE_BUCKET=${{ secrets.TF_STATE_BUCKET }}" >> "$GITHUB_ENV"

      # Map dev secrets (_DEV suffix) into the same neutral env var names.
      - name: Load dev secrets
        if: github.ref_name != 'main'
        run: |
          echo "::add-mask::${{ secrets.GCP_PROJECT_ID_DEV }}"
          echo "::add-mask::${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}"
          echo "::add-mask::${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}"
          echo "::add-mask::${{ secrets.HELIUS_API_KEY_DEV }}"
          echo "::add-mask::${{ secrets.CORS_ALLOW_ORIGIN_DEV }}"
          echo "::add-mask::${{ secrets.TF_STATE_BUCKET_DEV }}"
          echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID_DEV }}" >> "$GITHUB_ENV"
          echo "GCP_WORKLOAD_IDENTITY_PROVIDER=${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}" >> "$GITHUB_ENV"
          echo "GCP_SERVICE_ACCOUNT=${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}" >> "$GITHUB_ENV"
          echo "HELIUS_API_KEY=${{ secrets.HELIUS_API_KEY_DEV }}" >> "$GITHUB_ENV"
          echo "CORS_ALLOW_ORIGIN=${{ secrets.CORS_ALLOW_ORIGIN_DEV }}" >> "$GITHUB_ENV"
          echo "TF_STATE_BUCKET=${{ secrets.TF_STATE_BUCKET_DEV }}" >> "$GITHUB_ENV"

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Create Artifact Registry repository if needed
        run: |
          gcloud artifacts repositories describe ${{ env.REPO_NAME }} \
            --location=${{ env.REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet 2>/dev/null \
          || gcloud artifacts repositories create ${{ env.REPO_NAME }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet

      - name: Build Docker image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        # Uses a partial backend config — create the GCS bucket before first run:
        #   gsutil mb gs://YOUR_TF_STATE_BUCKET
        run: |
          ENV="${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="prefix=helius-rpc-proxy/${ENV}"

      - name: Terraform Apply
        run: |
          ENV="${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
          terraform -chdir=terraform apply \
            -var-file="environments/${ENV}.tfvars" \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="image=$IMAGE" \
            -var="helius_api_key=${{ env.HELIUS_API_KEY }}" \
            -var="cors_allow_origin=${{ env.CORS_ALLOW_ORIGIN }}" \
            -auto-approve
